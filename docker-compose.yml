services:
  product_service:
    build:
      context: .
      dockerfile: Dockerfile

    image: arpit667/product-service:1.0
    container_name: product-service

    ports:
      - "8003:8003"

    environment:
      PORT: "8003"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@product_db:5432/product_db?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET}"

    depends_on:
      product_db:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8003/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    restart: unless-stopped

    networks:
      - product-network

  product_db:
    image: postgres:16-alpine
    container_name: product-db

    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: product_db

    volumes:
      - product_db_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d product_db" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - product-network

volumes:
  product_db_data:
    name: product_db_data

networks:
  product-network:
    name: product-network
    driver: bridge